services:
  frontend:
    build: ./Frontend
    container_name: frontend
    ports:
      - "5173:5173"
    env_file:
      - ./Frontend/.env
    depends_on:
      - backend
    volumes:
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./Frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./Frontend/package.json

  backend:
    build: ./Backend
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    env_file:
      - ./Backend/.env
    depends_on:
      - redis
    volumes:
      - backend_node_modules:/app/node_modules
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./Backend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./Backend/package.json

  redisinsight:
    image: redis/redisinsight:latest
    container_name: smart-recruiter-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/db
    depends_on:
      - redis
    restart: unless-stopped


  drizzle-studio:
    build: ./Backend
    container_name: drizzle-studio
    working_dir: /app
    command: npx drizzle-kit studio --host 0.0.0.0 --port 4983
    ports:
      - "4983:4983"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: smart-recruiter_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  redisinsight_data:
  frontend_node_modules:
  backend_node_modules:
