services:
  frontend:
    build: ./Frontend
    container_name: frontend
    ports:
      - "5173:5173"
    env_file:
      - ./Frontend/.env
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  backend:
    build: ./Backend
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    env_file:
      - ./Backend/.env
    depends_on:
      - redis
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: smart-recruiter_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  frontend_node_modules:
  backend_node_modules:
